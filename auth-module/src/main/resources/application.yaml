spring:
  application:
    name: basic-auth

  datasource:
    url: ${DB_URL:jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: false

  jpa:
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-client-secret}
            scope:
              - email
              - profile

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

jwt:
  access-expiration: 900000
  refresh-expiration: 604800000

auth:
  gateway-url: ${GATEWAY_URL:http://localhost:8000}
  redirect-path: ${REDIRECT_PATH:/}
  issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8000}
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
